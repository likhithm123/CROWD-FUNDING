services:
  postgres:
    image: postgres:16-alpine
    container_name: crowdfund_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: crowdfunding_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crowdfunding_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowdfund_web
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgrespassword
      - PGDATABASE=crowdfunding_db
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/crowdfunding_db
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Platform Admin}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
      - SUPPORT_PASSWORD=${SUPPORT_PASSWORD}
      - SUPPORT_NAME=${SUPPORT_NAME:-Support Team}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
